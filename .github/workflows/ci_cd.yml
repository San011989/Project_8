name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Step 2: Run tests and AI evals ─────────────────────────────────────────
  test_and_eval:
    name: Run Tests & AI Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short

      - name: Run AI agent evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_evals.py

  # ── Step 3/4: Build Docker image (only if all checks pass on main) ──────────
  build_and_deploy:
    name: Build Docker Image & Deploy
    needs: test_and_eval
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t resolveai-api:${{ github.sha }} .
          docker tag resolveai-api:${{ github.sha }} resolveai-api:latest

      - name: Smoke-test the container (health check)
        run: |
          docker run -d --name resolveai_test \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -p 8000:8000 resolveai-api:latest
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs resolveai_test && exit 1)
          docker stop resolveai_test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: resolveai-api
        run: |
          # Tag the image built in the previous step
          docker tag resolveai-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag resolveai-api:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          
          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to Amazon ECS Fargate
        run: |
          echo "✅ Pushing new deployment to AWS ECS..."
          aws ecs update-service \
            --cluster resolveai-cluster \
            --service resolveai-service \
            --force-new-deployment
          
          echo "⏳ Waiting for service to become stable (this takes a few minutes)..."
          aws ecs wait services-stable \
            --cluster resolveai-cluster \
            --services resolveai-service
