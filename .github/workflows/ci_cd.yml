name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Step 2: Run tests and AI evals ─────────────────────────────────────────
  test_and_eval:
    name: Run Tests & AI Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short

      - name: Run AI agent evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_evals.py

  # ── Step 3/4: Build Docker image (only if all checks pass on main) ──────────
  build_and_deploy:
    name: Build Docker Image & Deploy
    needs: test_and_eval
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t resolveai-api:${{ github.sha }} .
          docker tag resolveai-api:${{ github.sha }} resolveai-api:latest

      - name: Smoke-test the container (health check)
        run: |
          docker run -d --name resolveai_test \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -p 8000:8000 resolveai-api:latest
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs resolveai_test && exit 1)
          docker stop resolveai_test

      - name: Deploy to cloud
        # Replace with your cloud provider command, e.g. GCP Cloud Run or AWS ECS
        run: |
          echo "✅ All checks passed. Deploying resolveai-api:${{ github.sha }} to cloud..."
          # Example GCP Cloud Run:
          # gcloud run deploy resolveai-api \
          #   --image gcr.io/$GCP_PROJECT/resolveai-api:${{ github.sha }} \
          #   --region us-central1 \
          #   --allow-unauthenticated
