name: CI/CD - ResolveAI Ticket Resolution Agent

# Mirrors ARCHITECTURE.md "Delivery Workflow":
#   Push code -> Run tests and AI evals -> All checks pass? -> Build Docker image -> Deploy to cloud -> Live
#
# Repo is a single FastAPI service (Dockerfile at repo root, one requirements.txt,
# entrypoint src.api.main:app). MCP servers run in-process, not as separate containers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: resolveai-api
  ECS_SERVICE: resolveai-api-svc
  ECS_CONTAINER_NAME: api

permissions:
  contents: read
  id-token: write   # for AWS OIDC login, no static keys

jobs:
  # ---- "Run tests" ----
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          # tests that exercise the agent need a key; a dummy value is fine
          # if your tests mock the LLM calls (recommended so CI doesn't
          # depend on a live OpenAI key / cost money on every push).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-placeholder' }}
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  # ---- "Run ... AI evals" ----
  agent-evals:
    name: Agent Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # EVALUATION_REPORT.md in the repo currently reads as a one-off,
      # hand-produced report (500 cases, Gemini 2.5 Pro as judge) rather
      # than something regenerated every push. For this gate to mean
      # anything in CI, add a script under scripts/ (e.g. scripts/run_evals.py)
      # that runs a smaller, fast eval subset against mocked tools/LLM and
      # exits non-zero if accuracy/escalation thresholds aren't met.
      # Until that script exists, this step is a placeholder -- replace the
      # command below once you've added it.
      - name: Run agent evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f scripts/run_evals.py ]; then
            python scripts/run_evals.py --min-resolution-rate 0.40 --max-false-negative-escalations 0
          else
            echo "::warning::scripts/run_evals.py not found - add an automated eval script so this gate is real. Skipping for now."
          fi

  # ---- "All checks pass? -> Build Docker image" ----
  build-and-push:
    name: Build & Push Image
    needs: [test, agent-evals]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build, tag, push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # flip to "1" once you're ready for this to block releases

  # ---- "Deploy to cloud" behind a health check -> "Live, serving users" ----
  deploy:
    name: Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition > current-task-def.json

      - name: Render new task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: current-task-def.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy (waits for ALB health check to go green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          # Enable deploymentCircuitBreaker {enable:true, rollback:true} on the
          # ECS service itself so a failed health check auto-rolls back.
